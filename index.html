<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionale Magazzino & Flotta Pro (A&G COFFEE)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        [x-cloak] { display: none !important; }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; }
            .no-print { display: none !important; }
            .print-modal-wrapper {
                position: static !important; display: block !important; background: transparent !important;
                padding: 0 !important; margin: 0 !important; overflow: visible !important; backdrop-filter: none !important;
            }
            .print-modal-wrapper[style*="display: none"] { display: none !important; }
            #printable-area, #printable-inventory-area {
                position: static !important; width: 100% !important; max-width: 100% !important;
                color: #000 !important; background: #fff !important; box-shadow: none !important;
                border: none !important; padding: 0 !important; margin: 0 !important;
            }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
        }
    </style>
</head>
<body :class="isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'" class="h-full flex flex-col transition-colors duration-200 overflow-x-hidden" x-data="appData()" x-init="initData()" @keydown.escape.window="handleEscapeKey()">

    <!-- Notifiche Toast -->
    <div x-show="notification.show" x-transition class="fixed top-4 right-4 z-[70] max-w-sm bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-3.5 flex items-center gap-3 no-print" x-cloak>
        <div :class="notification.type === 'error' ? 'bg-red-500/20 text-red-400' : 'bg-emerald-500/20 text-emerald-400'" class="p-2.5 rounded-xl shrink-0">
            <i :class="notification.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'" class="text-base"></i>
        </div>
        <div class="flex-1 min-w-0">
            <h4 class="text-xs font-black text-white" x-text="notification.title"></h4>
            <p class="text-[11px] text-slate-300" x-text="notification.message"></p>
        </div>
        <button @click="notification.show = false" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Schermata di Selezione Iniziale -->
    <template x-if="appMode === 'select'">
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950 overflow-y-auto">
            <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-6">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-warehouse text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-white">A&G COFFEE SRL</h1>
                    <p class="text-xs text-slate-400 mt-1">Seleziona la postazione operativa</p>
                </div>

                <div x-show="incomingLinkBoatName" class="bg-emerald-500/15 border border-emerald-500/40 rounded-2xl p-3.5 text-left flex items-center gap-3 animate-pulse" x-cloak>
                    <div class="bg-emerald-500 text-slate-950 w-9 h-9 rounded-xl flex items-center justify-center shrink-0 font-black">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                    </div>
                    <div class="text-xs">
                        <p class="font-black text-emerald-300">Rimanenze ricevute da WhatsApp!</p>
                        <p class="text-slate-300 mt-0.5">Barca: <strong class="text-white" x-text="incomingLinkBoatName"></strong>. Accedi all'Ufficio.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button @click="switchMode('barca')" class="bg-gradient-to-br from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white p-5 rounded-2xl text-left shadow-lg transition flex flex-col justify-between gap-3">
                        <div class="bg-white/15 w-11 h-11 rounded-xl flex items-center justify-center"><i class="fa-solid fa-sailboat text-xl"></i></div>
                        <div>
                            <h3 class="font-black text-sm sm:text-base">1. Terminale Operatore Barca</h3>
                            <p class="text-[11px] text-emerald-100 mt-1">Conta le rimanenze e invia il link WhatsApp.</p>
                        </div>
                    </button>
                    <button @click="openPasswordModal()" class="bg-gradient-to-br from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white p-5 rounded-2xl text-left shadow-lg transition flex flex-col justify-between gap-3 relative">
                        <span x-show="pendingBoatSubmissions.length > 0" class="absolute top-4 right-4 bg-red-500 text-white px-2.5 py-1 rounded-full text-xs font-black animate-bounce shadow" x-text="pendingBoatSubmissions.length + ' Nuovi'" x-cloak></span>
                        <div class="bg-white/15 w-11 h-11 rounded-xl flex items-center justify-center"><i class="fa-solid fa-lock text-xl"></i></div>
                        <div>
                            <h3 class="font-black text-sm sm:text-base">2. Postazione Ufficio & Magazzino</h3>
                            <p class="text-[11px] text-blue-100 mt-1">Area riservata protetta da password.</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- Modal Password Ufficio -->
    <div x-show="passwordModalOpen" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 no-print" x-cloak>
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-white text-center">
            <div class="bg-blue-600/20 text-blue-400 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-lg"><i class="fa-solid fa-shield-halved"></i></div>
            <div>
                <h3 class="text-base font-black">Accesso Riservato Ufficio</h3>
                <p class="text-xs text-slate-400 mt-1">Inserisci la password amministrativa.</p>
            </div>
            <form @submit.prevent="verifyOfficePassword()" class="space-y-3">
                <input type="password" x-model="enteredPassword" required autofocus class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-3 text-center text-sm font-black tracking-widest focus:outline-none focus:border-blue-500" placeholder="Password...">
                <p class="text-[10px] text-slate-500">Password predefinita: <span class="text-slate-300 font-bold">admin</span></p>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button type="button" @click="passwordModalOpen = false; enteredPassword = ''" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold">Annulla</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-xs font-black shadow">Sblocca</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Impostazioni Ufficio -->
    <div x-show="settingsModalOpen" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 no-print" x-cloak>
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-white">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-black flex items-center gap-2"><i class="fa-solid fa-gear text-amber-400"></i> Impostazioni Ufficio</h3>
                <button @click="settingsModalOpen = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form @submit.prevent="saveOfficeSettings()" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-emerald-400 mb-1 flex items-center gap-1.5">
                        <i class="fa-brands fa-whatsapp"></i> Numero WhatsApp Destinatario Ufficio
                    </label>
                    <input type="tel" x-model="officePhoneInput" class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none focus:border-emerald-500" placeholder="Es. 393331234567 (con prefisso 39)">
                    <p class="text-[10px] text-slate-400 mt-1">Se inserito, WhatsApp aprirà direttamente la chat con questo contatto.</p>
                </div>
                <div class="border-t border-slate-800 pt-3">
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Nuova Password (lascia vuoto per non cambiare)</label>
                    <input type="password" x-model="newPasswordInput" class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none" placeholder="Nuova password...">
                </div>
                <div x-show="newPasswordInput">
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Conferma Nuova Password</label>
                    <input type="password" x-model="confirmPasswordInput" class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none" placeholder="Ripeti password...">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" @click="settingsModalOpen = false" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Annulla</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-black">Salva Impostazioni</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Terminale Operatore Barca -->
    <template x-if="appMode === 'barca'">
        <div class="flex-1 flex flex-col h-full bg-slate-950 text-slate-100">
            <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-2.5">
                    <div class="bg-emerald-600 p-2.5 rounded-xl text-white shadow"><i class="fa-solid fa-sailboat"></i></div>
                    <div>
                        <h2 class="text-sm sm:text-base font-black">Terminale Operatore Barca</h2>
                        <p class="text-[11px] text-slate-400">Inserimento Conteggio & Invio WhatsApp</p>
                    </div>
                </div>
                <button @click="switchMode('select')" class="bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold text-slate-300">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Indietro
                </button>
            </header>

            <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 overflow-y-auto pb-36">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2.5 shadow">
                    <label class="block text-xs font-extrabold text-emerald-400 uppercase tracking-wider">Seleziona Imbarcazione:</label>
                    <select x-model="selectedBoatForCrew" @change="loadCrewInventory()" class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-3 text-sm font-black focus:outline-none focus:border-emerald-500">
                        <option value="">-- Seleziona Barca --</option>
                        <template x-for="b in boats" :key="b.id">
                            <option :value="b.id" x-text="b.name"></option>
                        </template>
                    </select>
                </div>

                <template x-if="selectedBoatForCrew">
                    <div class="space-y-4">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h3 class="text-sm font-black text-white flex items-center gap-2">
                                    <i class="fa-solid fa-boxes-stacked text-emerald-400"></i>
                                    <span x-text="'Rimanenze: ' + getBoatName(selectedBoatForCrew)"></span>
                                </h3>
                                <p class="text-[11px] text-slate-400 mt-0.5">Inserisci i pezzi contati a bordo.</p>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <input type="text" x-model="searchFilter.crewProducts" placeholder="🔍 Cerca voce..." class="bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs flex-1 sm:w-44">
                                <input type="date" x-model="crewInventoryDate" class="bg-slate-950 border border-slate-700 text-white rounded-xl px-2.5 py-2 text-xs font-bold">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <template x-for="row in filteredCrewInventoryRows" :key="row.productId">
                                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-3">
                                    <span class="font-extrabold text-xs sm:text-sm truncate flex-1 text-white" x-text="row.productName"></span>
                                    <div class="flex items-center gap-1.5 shrink-0">
                                        <button type="button" @click="row.physicalQty = Math.max(0, Number(row.physicalQty || 0) - 1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-black text-base">-</button>
                                        <input type="number" step="0.01" min="0" x-model.number="row.physicalQty" class="w-16 bg-slate-950 border border-slate-700 text-emerald-400 rounded-xl text-center font-black text-sm py-2">
                                        <button type="button" @click="row.physicalQty = Number(row.physicalQty || 0) + 1" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-black text-base">+</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div class="sticky bottom-3 bg-slate-950/95 backdrop-blur p-3 rounded-2xl border border-slate-800 shadow-2xl space-y-2">
                            <a :href="getWhatsAppShareUrl()" target="_blank" rel="noopener noreferrer" @click="onWhatsAppAnchorClick($event)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-5 rounded-xl text-xs sm:text-sm font-black shadow-lg transition flex items-center justify-center gap-2.5 cursor-pointer">
                                <i class="fa-brands fa-whatsapp text-xl"></i> 
                                <span x-text="officeWhatsAppNumber ? 'Invia su WhatsApp all\'Ufficio (' + officeWhatsAppNumber + ')' : 'Invia Rimanenze su WhatsApp all\'Ufficio'"></span>
                            </a>
                            <button type="button" @click="copyDirectShareLink()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-link text-sky-400"></i> Copia Link Diretto
                            </button>
                        </div>
                    </div>
                </template>
            </main>
        </div>
    </template>

    <!-- Postazione Ufficio & Magazzino -->
    <template x-if="appMode === 'ufficio'">
        <div class="flex-1 flex flex-col h-full">
            <header :class="isDarkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'" class="border-b sticky top-0 z-40 no-print">
                <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                    <div class="flex items-center justify-between gap-2 w-full sm:w-auto">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <button @click="switchMode('select')" :class="isDarkMode ? 'bg-slate-800 text-slate-300' : 'bg-slate-200 text-slate-700'" class="p-2 rounded-xl shrink-0" title="Blocca ed Esci"><i class="fa-solid fa-lock text-xs"></i></button>
                            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md shadow-blue-500/20 shrink-0">
                                <i class="fa-solid fa-warehouse text-sm sm:text-base"></i>
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <h1 class="text-xs sm:text-base font-black tracking-tight truncate">Ufficio & Magazzino Pro</h1>
                                    <span class="inline-flex items-center gap-1 text-[9px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded-full shrink-0">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Sync
                                    </span>
                                </div>
                                <p class="text-[10px] sm:text-[11px] text-slate-400 truncate">A&G COFFEE SRL • Controllo Flotta</p>
                            </div>
                        </div>

                        <button @click="toggleTheme()" :class="isDarkMode ? 'bg-slate-800 text-amber-400 border-slate-700' : 'bg-slate-200 text-slate-700 border-slate-300'" class="sm:hidden p-2 rounded-xl border text-xs font-bold shrink-0">
                            <i :class="isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between sm:justify-end gap-1.5 w-full sm:w-auto overflow-x-auto pb-0.5 sm:pb-0">
                        <button @click="openSettingsModal()" class="flex-1 sm:flex-none bg-amber-600/20 text-amber-400 border border-amber-500/30 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 shrink-0">
                            <i class="fa-solid fa-gear"></i><span>Impostazioni</span>
                        </button>
                        <button @click="exportBackup()" class="flex-1 sm:flex-none bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 shrink-0">
                            <i class="fa-solid fa-download"></i><span>Backup</span>
                        </button>
                        <label class="flex-1 sm:flex-none bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl text-[11px] sm:text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer shrink-0">
                            <i class="fa-solid fa-upload"></i><span>Ripristina</span>
                            <input type="file" accept=".json" @change="importBackup($event)" class="hidden">
                        </label>
                        <button @click="toggleTheme()" :class="isDarkMode ? 'bg-slate-800 text-amber-400 border-slate-700' : 'bg-slate-200 text-slate-700 border-slate-300'" class="hidden sm:flex p-2.5 rounded-xl border text-xs font-bold shrink-0">
                            <i :class="isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                        </button>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-4 pb-12 overflow-y-auto no-print space-y-4">

                <!-- Tab Menu Navigazione Ufficio -->
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                    <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'ring-2 ring-blue-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-blue-600 to-indigo-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-chart-pie text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Dashboard</h3>
                            <p class="text-[10px] text-blue-100">Panoramica</p>
                        </div>
                    </button>
                    <button @click="activeTab = 'rimanenze'" :class="activeTab === 'rimanenze' ? 'ring-2 ring-emerald-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-emerald-600 to-teal-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2 relative">
                        <i class="fa-solid fa-bell text-lg"></i>
                        <span x-show="pendingBoatSubmissions.length > 0" class="absolute top-2.5 right-2.5 bg-red-500 text-white px-2 py-0.5 rounded-full text-[10px] font-black animate-pulse shadow" x-text="pendingBoatSubmissions.length" x-cloak></span>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Rimanenze</h3>
                            <p class="text-[10px] text-emerald-100">Da Barche (<span x-text="pendingBoatSubmissions.length"></span>)</p>
                        </div>
                    </button>
                    <button @click="activeTab = 'magazzino'" :class="activeTab === 'magazzino' ? 'ring-2 ring-purple-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-purple-600 to-fuchsia-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-truck-ramp-box text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm leading-tight">Magazzino Generale</h3>
                            <p class="text-[10px] text-purple-100">Carico Fornitori</p>
                        </div>
                    </button>
                    <button @click="activeTab = 'flotta'" :class="activeTab === 'flotta' ? 'ring-2 ring-amber-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-amber-600 to-orange-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-sailboat text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Flotta & Barche</h3>
                            <p class="text-[10px] text-amber-100" x-text="boats.length + ' Unità'"></p>
                        </div>
                    </button>
                    <button @click="activeTab = 'prodotti'" :class="activeTab === 'prodotti' ? 'ring-2 ring-sky-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-sky-600 to-cyan-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-tags text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Listino</h3>
                            <p class="text-[10px] text-sky-100" x-text="products.length + ' Articoli'"></p>
                        </div>
                    </button>
                    <button @click="activeTab = 'storico'" :class="activeTab === 'storico' ? 'ring-2 ring-teal-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-teal-700 to-emerald-800 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Storico & Verbali</h3>
                            <p class="text-[10px] text-teal-100">Archivio</p>
                        </div>
                    </button>
                </div>

                <!-- CONTENUTO TAB: DASHBOARD -->
                <div x-show="activeTab === 'dashboard'" class="space-y-4">

                reconciliationActualRevenue: 0,
                reconciliationDiff: 0,

                loadAllStateFromStorage() {
                    if (localStorage.getItem('gest_products')) this.products = JSON.parse(localStorage.getItem('gest_products'));
                    if (localStorage.getItem('gest_loads')) this.warehouseLoads = JSON.parse(localStorage.getItem('gest_loads'));
                    if (localStorage.getItem('gest_boats')) this.boats = JSON.parse(localStorage.getItem('gest_boats'));
                    if (localStorage.getItem('gest_transfers')) this.transfers = JSON.parse(localStorage.getItem('gest_transfers'));
                    if (localStorage.getItem('gest_boat_transfers')) this.boatTransfers = JSON.parse(localStorage.getItem('gest_boat_transfers'));
                    if (localStorage.getItem('gest_boat_passes')) this.boatPasses = JSON.parse(localStorage.getItem('gest_boat_passes'));
                    if (localStorage.getItem('gest_inventories')) this.inventoryLogs = JSON.parse(localStorage.getItem('gest_inventories'));
                    if (localStorage.getItem('gest_pending_subs')) this.pendingBoatSubmissions = JSON.parse(localStorage.getItem('gest_pending_subs'));
                    if (localStorage.getItem('gest_office_pwd')) this.officePassword = localStorage.getItem('gest_office_pwd');
                    if (localStorage.getItem('gest_office_wa')) this.officeWhatsAppNumber = localStorage.getItem('gest_office_wa');
                },

                    if (savedTheme !== null) this.isDarkMode = savedTheme === 'dark';
                    this.loadAllStateFromStorage();

                    if (this.products.length === 0) {
                        this.products = [
                            { id: 'p_acq_nat', name: 'Acqua Naturale 💧', costPrice: 0.4, sellPrice: 2.0 },

                            { id: 'p_red_1', name: 'Red Bull ⚡', costPrice: 1.4, sellPrice: 4.5 },
                            { id: 'p_red_2', name: 'Gatorade ⚡', costPrice: 1.2, sellPrice: 4.0 },
                            { id: 'p_vin_1', name: 'Prosecco Calice / Bottiglietta 🍷', costPrice: 2.0, sellPrice: 6.0 },
                            { id: 'p_vin_2', name: 'Vino Bianco / Falanghina 🍷', costPrice: 2.0, sellPrice: 6.0 },
                            { id: 'p_rin_1', name: 'Ringo Vaniglia 🍪', costPrice: 0.6, sellPrice: 2.5 },
                            { id: 'p_rin_2', name: 'Ringo Cacao 🍪', costPrice: 0.6, sellPrice: 2.5 },
                            { id: 'p_rin_3', name: 'Baiocchi / Pan di Stelle 🍪', costPrice: 0.7, sellPrice: 2.5 },
                            { id: 'p_bue_1', name: 'Kinder Bueno 🍫', costPrice: 0.9, sellPrice: 3.0 },
                            { id: 'p_bue_2', name: 'Kinder Bueno White 🍫', costPrice: 0.9, sellPrice: 3.0 },
                            { id: 'p_bue_3', name: 'Kinder Cereali 🍫', costPrice: 0.7, sellPrice: 2.5 },
                            { id: 'p_kin', name: 'Kinder Maxi / Cioccolato 🍫', costPrice: 0.6, sellPrice: 2.5 },
                            { id: 'p_twi_1', name: 'Twix 🍫', costPrice: 0.7, sellPrice: 2.5 },

                            { id: 'p_car_2', name: 'Caramelle Goleador / Tic Tac 🍬', costPrice: 0.5, sellPrice: 2.0 },
                            { id: 'p_caf_1', name: 'Caffè Espresso ☕', costPrice: 0.25, sellPrice: 1.5 },

                    if (this.boats.length === 0) {
                        const fullFleet = [
                            "TREMITI JET", "GIUNONE JET", "VESUVIO JET", "NAPOLI JET", "SALERNO JET",
                            "AMALFI JET", "SUPER JET", "CAPRI JET", "ISCHIA JET", "SORRENTO JET",
                            "PROCIDA JET", "POSITANO JET", "RAVELLO JET", "MAIORI JET", "MINORI JET",
                            "CETARA JET", "VIETRI JET", "BAIA JET", "POZZUOLI JET", "NISIDA JET",
                            "MERGELLINA JET"
                        ];
                        this.boats = fullFleet.map((name, idx) => ({ id: 'b_' + (idx + 1), name }));
                        this.saveToLocalStorage();
                    }

                    this.checkIncomingWhatsAppLink();
                },

                checkIncomingWhatsAppLink() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const compactParam = urlParams.get('d');
                    if (!compactParam) return;

                    try {
                        const parts = compactParam.split('|');
                        if (parts.length >= 2) {
                            const boatId = parts[0];
                            const dateStr = parts[1];
                            const pairsStr = parts[2] || '';
                            const qtyMap = {};

                            if (pairsStr) {
                                pairsStr.split(',').forEach(pair => {
                                    const [pid, qty] = pair.split(':');
                                    if (pid && qty !== undefined) qtyMap[pid] = Number(qty);
                                });
                            }

                            const allRows = this.products.map(p => ({
                                productId: p.id,
                                productName: p.name,
                                physicalQty: qtyMap[p.id] || 0
                            }));

                            const subId = 'sub_' + boatId + '_' + dateStr + '_' + btoa(pairsStr).slice(0, 10);
                            if (!this.pendingBoatSubmissions.some(s => s.id === subId)) {
                                this.pendingBoatSubmissions.push({
                                    id: subId,
                                    timestamp: Date.now(),
                                    boatId: boatId,
                                    date: dateStr,
                                    items: allRows
                                });
                                this.saveToLocalStorage();
                            }

                            this.incomingLinkBoatName = this.getBoatName(boatId);
                            this.activeTab = 'rimanenze';
                            if (window.location.protocol.startsWith('http')) {
                                window.history.replaceState({}, document.title, window.location.pathname);
                            }
                            this.showNotify('Inventario Ricevuto!', `Dati di ${this.incomingLinkBoatName} caricati.`);
                            this.openPasswordModal();
                        }
                    } catch (e) { console.error(e); }
                },

                openPasswordModal() { this.enteredPassword = ''; this.passwordModalOpen = true; },
                verifyOfficePassword() {
                    if (this.enteredPassword === this.officePassword) {
                        this.passwordModalOpen = false;
                        this.enteredPassword = '';
                        this.switchMode('ufficio');
                        if (this.incomingLinkBoatName) {
                            this.activeTab = 'rimanenze';
                            this.incomingLinkBoatName = '';
                        }
                    } else {
                        this.showNotify('Errore', 'Password errata.', 'error');
                        this.enteredPassword = '';
                    }
                },
                openSettingsModal() {
                    this.officePhoneInput = this.officeWhatsAppNumber || '';
                    this.newPasswordInput = '';
                    this.confirmPasswordInput = '';
                    this.settingsModalOpen = true;
                },
                saveOfficeSettings() {
                    const cleanPhone = (this.officePhoneInput || '').replace(/[^0-9]/g, '');
                    this.officeWhatsAppNumber = cleanPhone;
                    localStorage.setItem('gest_office_wa', cleanPhone);

                    if (this.newPasswordInput) {
                        if (this.newPasswordInput !== this.confirmPasswordInput) {
                            this.showNotify('Errore', 'Le password non coincidono.', 'error');
                            return;
                        }
                        this.officePassword = this.newPasswordInput;
                        localStorage.setItem('gest_office_pwd', this.officePassword);
                    }

                    this.settingsModalOpen = false;
                    this.showNotify('Salvato', 'Impostazioni ufficio aggiornate.');
                },

                switchMode(mode) { this.loadAllStateFromStorage(); this.appMode = mode; },
                saveToLocalStorage() {
                    localStorage.setItem('gest_products', JSON.stringify(this.products));
                    localStorage.setItem('gest_loads', JSON.stringify(this.warehouseLoads));
                    localStorage.setItem('gest_boats', JSON.stringify(this.boats));
                    localStorage.setItem('gest_transfers', JSON.stringify(this.transfers));
                    localStorage.setItem('gest_boat_transfers', JSON.stringify(this.boatTransfers));
                    localStorage.setItem('gest_boat_passes', JSON.stringify(this.boatPasses));
                    localStorage.setItem('gest_inventories', JSON.stringify(this.inventoryLogs));
                    localStorage.setItem('gest_pending_subs', JSON.stringify(this.pendingBoatSubmissions));
                },
                toggleTheme() { this.isDarkMode = !this.isDarkMode; localStorage.setItem('gest_theme', this.isDarkMode ? 'dark' : 'light'); },
                showNotify(title, message, type = 'success') {
                    this.notification = { show: true, title, message, type };
                    setTimeout(() => { this.notification.show = false; }, 4500);
                },
                formatCurrency(val) { return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(val || 0); },
                getProductName(id) {
                    const p = this.products.find(item => item.id === id);
                    return p ? p.name : 'Articolo';
                },
                getBoatName(id) {
                    const b = this.boats.find(item => item.id === id);
                    return b ? b.name : 'Barca';
                },
                handleEscapeKey() {
                    this.passwordModalOpen = false;
                    this.settingsModalOpen = false;
                    this.boatHub.open = false;
                    this.reconciliationModal.open = false;
                },

                loadCrewInventory() {
                    this.crewInventoryRows = this.products.map(p => ({ productId: p.id, productName: p.name, physicalQty: 0 }));
                },
                get filteredCrewInventoryRows() {
                    if (!this.searchFilter.crewProducts) return this.crewInventoryRows;
                    const q = this.searchFilter.crewProducts.toLowerCase();
                    return this.crewInventoryRows.filter(r => r.productName.toLowerCase().includes(q));
                },
                buildGeneratedShareLink() {
                    if (!this.selectedBoatForCrew) return '';
                    const nonZeroPairs = this.crewInventoryRows.filter(r => Number(r.physicalQty || 0) > 0).map(r => `${r.productId}:${Number(r.physicalQty)}`).join(',');
                    const compactPayload = `${this.selectedBoatForCrew}|${this.crewInventoryDate}|${nonZeroPairs}`;
                    const isHttp = window.location.protocol.startsWith('http');
                    const baseUrl = isHttp ? (window.location.origin + window.location.pathname) : 'https://agcoffee.github.io/gestionale/';
                    return `${baseUrl}?d=${encodeURIComponent(compactPayload)}`;
                },
                getWhatsAppShareUrl() {
                    if (!this.selectedBoatForCrew) return '#';
                    const fullLink = this.buildGeneratedShareLink();
                    const boatName = this.getBoatName(this.selectedBoatForCrew);
                    const message = `📊 *RIMANENZE: ${boatName}* (${this.crewInventoryDate})\n\nClicca per inviare:\n${fullLink}`;
                    const phoneParam = this.officeWhatsAppNumber ? `phone=${this.officeWhatsAppNumber}&` : '';
                    return `https://api.whatsapp.com/send?${phoneParam}text=${encodeURIComponent(message)}`;
                },
                onWhatsAppAnchorClick(e) {
                    if (!this.selectedBoatForCrew) { e.preventDefault(); this.showNotify('Attenzione', 'Seleziona prima la barca.', 'error'); }
                },
                copyDirectShareLink() {
                    const fullLink = this.buildGeneratedShareLink();
                    if (!fullLink) return;
                    navigator.clipboard.writeText(fullLink).then(() => this.showNotify('Copiato!', 'Link pronto per WhatsApp.'));
                },
                deletePendingSubmission(id) {
                    this.pendingBoatSubmissions = this.pendingBoatSubmissions.filter(s => s.id !== id);
                    this.saveToLocalStorage();
                },

                openBoatHub(boatId, tab = 'carico') {
                    this.boatHub.boatId = boatId;
                    this.boatHub.tab = tab;
                    this.boatOperationQuantities = {};
                    this.targetBoatId = '';
                    this.boatHub.open = true;
                },
                saveBoatOperation(type) {
                    const items = [];
                    Object.keys(this.boatOperationQuantities).forEach(pid => {
                        const qty = Number(this.boatOperationQuantities[pid] || 0);
                        if (qty > 0) items.push({ productId: pid, quantity: qty });
                    });
                    if (items.length === 0) {
                        this.showNotify('Attenzione', 'Inserisci almeno una quantità.', 'error');
                        return;
                    }

                    const ts = Date.now();
                    const dateStr = new Date().toISOString().split('T')[0];

                    if (type === 'carico') {
                        this.transfers.push({ id: 't_' + ts, timestamp: ts, boatId: this.boatHub.boatId, bollaNumber: 'CARICO UFF.', date: dateStr, items });
                        this.showNotify('Caricato', 'Merce scaricata dal magazzino verso la barca.');
                    } else if (type === 'spostamento') {
                        if (!this.targetBoatId) { this.showNotify('Attenzione', 'Seleziona la barca ricevente.', 'error'); return; }
                        this.boatTransfers.push({ id: 'bt_' + ts, timestamp: ts, fromBoatId: this.boatHub.boatId, toBoatId: this.targetBoatId, bollaNumber: 'SPOSTAMENTO', date: dateStr, items });
                        this.showNotify('Spostato', 'Merce trasferita tra barche.');
                    } else if (type === 'buoni') {
                        this.boatPasses.push({ id: 'bp_' + ts, timestamp: ts, boatId: this.boatHub.boatId, passType: this.passType, date: dateStr, items });
                        this.showNotify('Registrato', 'Buono/Comando registrato.');
                    }

                    this.saveToLocalStorage();
                    this.boatHub.open = false;
                },

                openReconciliationModal(sub) {
                    this.reconciliationModal.submission = sub;
                    const boatId = sub.boatId;

                    const boatInvs = this.inventoryLogs.filter(i => i.boatId === boatId);
                    const lastInv = boatInvs.length > 0 ? boatInvs[boatInvs.length - 1] : null;
                    const lastTs = lastInv ? (lastInv.timestamp || 0) : 0;

                    let initMap = {}, addMap = {}, movedOutMap = {}, movedInMap = {}, passMap = {};
                    if (lastInv && lastInv.items) {
                        lastInv.items.forEach(i => initMap[i.productId] = Number(i.physicalQty || 0));
                    }

                    this.transfers.filter(t => t.boatId === boatId && (t.timestamp || 0) > lastTs).forEach(t => {
                        t.items.forEach(i => addMap[i.productId] = (addMap[i.productId] || 0) + Number(i.quantity || 0));
                    });

                    this.boatTransfers.filter(bt => bt.fromBoatId === boatId && (bt.timestamp || 0) > lastTs).forEach(bt => {
                        bt.items.forEach(i => movedOutMap[i.productId] = (movedOutMap[i.productId] || 0) + Number(i.quantity || 0));
                    });

                    this.boatTransfers.filter(bt => bt.toBoatId === boatId && (bt.timestamp || 0) > lastTs).forEach(bt => {
                        bt.items.forEach(i => movedInMap[i.productId] = (movedInMap[i.productId] || 0) + Number(i.quantity || 0));
                    });

                    this.boatPasses.filter(bp => bp.boatId === boatId && (bp.timestamp || 0) > lastTs).forEach(bp => {
                        bp.items.forEach(i => passMap[i.productId] = (passMap[i.productId] || 0) + Number(i.quantity || 0));
                    });

                    const realPhysicalMap = {};
                    sub.items.forEach(i => realPhysicalMap[i.productId] = Number(i.physicalQty || 0));

                    this.reconciliationRows = this.products.map(p => {
                        const id = p.id;
                        const initialQty = initMap[id] || 0;
                        const addedQty = (addMap[id] || 0) + (movedInMap[id] || 0);
                        const movedQty = (movedOutMap[id] || 0) + (passMap[id] || 0);
                        const theoreticalQty = Math.max(0, initialQty + addedQty - movedQty);
                        
                        const physicalQty = realPhysicalMap[id] !== undefined ? realPhysicalMap[id] : theoreticalQty;
                        const soldQty = Math.max(0, theoreticalQty - physicalQty);
                        const sellPrice = p.sellPrice || 0;
                        const expectedRevenue = soldQty * sellPrice;

                        return {
                            productId: id,
                            productName: p.name,
                            initialQty,
                            addedQty,
                            movedQty,
                            passQty: passMap[id] || 0,
                            theoreticalQty,
                            physicalQty,
                            soldQty,
                            sellPrice,
                            expectedRevenue
                        };
                    });

                    this.recalculateReconciliation();
                    this.reconciliationModal.open = true;
                },

                recalculateReconciliation() {
                    this.reconciliationRows.forEach(row => {
                        row.theoreticalQty = Math.max(0, row.initialQty + row.addedQty - row.movedQty);
                        row.soldQty = Math.max(0, row.theoreticalQty - row.physicalQty);
                        row.expectedRevenue = row.soldQty * row.sellPrice;
                    });
                    this.reconciliationExpectedTotal = this.reconciliationRows.reduce((sum, r) => sum + r.expectedRevenue, 0);
                    if (!this.reconciliationActualRevenue) {
                        this.reconciliationActualRevenue = Number(this.reconciliationExpectedTotal.toFixed(2));
                    }
                    this.updateReconciliationDiff();
                },

                updateReconciliationDiff() {
                    this.reconciliationDiff = Number(this.reconciliationActualRevenue || 0) - this.reconciliationExpectedTotal;
                },

                finalizeReconciliation() {
                    const sub = this.reconciliationModal.submission;
                    const ts = Date.now();
                    this.recalculateReconciliation();
                    const newInv = {
                        id: 'inv_' + ts,
                        timestamp: ts,
                        boatId: sub.boatId,
                        date: sub.date,
                        items: JSON.parse(JSON.stringify(this.reconciliationRows)),
                        expectedRevenue: this.reconciliationExpectedTotal,
                        actualRevenue: Number(this.reconciliationActualRevenue || 0),
                        cashDiff: this.reconciliationDiff
                    };
                    this.inventoryLogs.push(newInv);
                    this.pendingBoatSubmissions = this.pendingBoatSubmissions.filter(s => s.id !== sub.id);
                    this.saveToLocalStorage();
                    this.reconciliationModal.open = false;
                    this.inventoryPrintModal.data = {
                        boatName: this.getBoatName(sub.boatId),
                        date: sub.date,
                        expectedRevenue: newInv.expectedRevenue,
                        actualRevenue: newInv.actualRevenue,
                        cashDiff: newInv.cashDiff,
                        items: newInv.items
                    };
                    this.inventoryPrintModal.open = true;
                    this.showNotify('Cassa Chiusa!', 'Verbale registrato e giacenze aggiornate.');
                },

                getBoatTheoreticalItemsCount(boatId) {
                    const invs = this.inventoryLogs.filter(i => i.boatId === boatId);
                    const lastInv = invs.length > 0 ? invs[invs.length - 1] : null;
                    const lastTs = lastInv ? (lastInv.timestamp || 0) : 0;
                    let tot = 0;
                    if (lastInv && lastInv.items) lastInv.items.forEach(i => tot += Number(i.physicalQty || 0));
                    this.transfers.filter(t => t.boatId === boatId && (t.timestamp || 0) > lastTs).forEach(t => t.items.forEach(i => tot += Number(i.quantity || 0)));
                    return Math.max(0, tot);
                },

                getWarehouseProductQty(productId) {
                    let loaded = 0, transferred = 0;
                    this.warehouseLoads.forEach(l => (l.items || [l]).forEach(i => { if (i.productId === productId) loaded += Number(i.quantity); }));
                    this.transfers.forEach(t => t.items.forEach(i => { if (i.productId === productId) transferred += Number(i.quantity); }));
                    return Math.max(0, loaded - transferred);
                },
                getWarehouseStockSummary() {
                    return this.products.map(p => {
                        const qty = this.getWarehouseProductQty(p.id);
                        return { productId: p.id, name: p.name, qty, totalCost: qty * p.costPrice };
                    });
                },
                getTotalWarehouseCostValue() {
                    return this.getWarehouseStockSummary().reduce((sum, i) => sum + i.totalCost, 0);
                },

                openProductModal() {
                    this.productModal.isEdit = false;
                    this.productModal.form = { id: 'p_' + Date.now(), name: '', costPrice: 0, sellPrice: 0 };
                    this.productModal.open = true;
                },
                editProduct(p) {
                    this.productModal.isEdit = true;
                    this.productModal.form = { ...p };
                    this.productModal.open = true;
                },
                saveProduct() {
                    if (this.productModal.isEdit) {
                        const i = this.products.findIndex(p => p.id === this.productModal.form.id);
                        if (i !== -1) this.products[i] = { ...this.productModal.form };
                    } else {
                        this.products.push({ ...this.productModal.form });
                    }
                    this.productModal.open = false;
                    this.saveToLocalStorage();
                },
                deleteProduct(id) {
                    this.products = this.products.filter(p => p.id !== id);
                    this.saveToLocalStorage();
                },

                openBoatModal() {
                    this.boatModal.isEdit = false;
                    this.boatModal.form = { id: 'boat_' + Date.now(), name: '' };
                    this.boatModal.open = true;
                },
                editBoat(b) {
                    this.boatModal.isEdit = true;
                    this.boatModal.form = { ...b };
                    this.boatModal.open = true;
                },
                saveBoat() {
                    if (this.boatModal.isEdit) {
                        const i = this.boats.findIndex(b => b.id === this.boatModal.form.id);
                        if (i !== -1) this.boats[i] = { ...this.boatModal.form };
                    } else {
                        this.boats.push({ ...this.boatModal.form });
                    }
                    this.boatModal.open = false;
                    this.saveToLocalStorage();
                },
                deleteBoat(id) {
                    this.boats = this.boats.filter(b => b.id !== id);
                    this.saveToLocalStorage();
                },

                addAllMultiLoadItems() {
                    const items = [];
                    this.products.forEach(p => {
                        const q = Number(this.multiLoadQuantities[p.id] || 0);
                        if (q > 0) items.push({ productId: p.id, quantity: q });
                    });
                    if (items.length === 0) return;
                    this.warehouseLoads.push({
                        id: 'load_' + Date.now(),
                        timestamp: Date.now(),
                        docNumber: this.loadForm.docNumber || 'CARICO',
                        date: this.loadForm.date,
                        items
                    });
                    this.multiLoadQuantities = {};
                    this.saveToLocalStorage();
                    this.showNotify('Caricato', 'Magazzino aggiornato con successo.');
                },

                openSavedInventoryPrint(inv) {
                    this.inventoryPrintModal.data = {
                        boatName: this.getBoatName(inv.boatId),
                        date: inv.date,
                        expectedRevenue: inv.expectedRevenue,
                        actualRevenue: inv.actualRevenue,
                        cashDiff: inv.cashDiff,
                        items: inv.items
                    };
                    this.inventoryPrintModal.open = true;
                },
                deleteInventoryLog(id) {
                    this.inventoryLogs = this.inventoryLogs.filter(i => i.id !== id);
                    this.saveToLocalStorage();
                },

                exportBackup() {
                    const data = { products: this.products, warehouseLoads: this.warehouseLoads, boats: this.boats, transfers: this.transfers, boatTransfers: this.boatTransfers, boatPasses: this.boatPasses, inventoryLogs: this.inventoryLogs, pendingBoatSubmissions: this.pendingBoatSubmissions, officeWhatsAppNumber: this.officeWhatsAppNumber };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `backup_flotta_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                },
                importBackup(e) {
                    const f = e.target.files[0];
                    if (!f) return;
                    const r = new FileReader();
                    r.onload = (ev) => {
                        try {
                            const d = JSON.parse(ev.target.result);
                            if (d.products) {
                                this.products = d.products;
                                this.boats = d.boats || this.boats;
                                this.warehouseLoads = d.warehouseLoads || [];
                                this.transfers = d.transfers || [];
                                this.boatTransfers = d.boatTransfers || [];
                                this.boatPasses = d.boatPasses || [];
                                this.inventoryLogs = d.inventoryLogs || [];
                                this.pendingBoatSubmissions = d.pendingBoatSubmissions || [];
                                if (d.officeWhatsAppNumber !== undefined) {
                                    this.officeWhatsAppNumber = d.officeWhatsAppNumber;
                                    localStorage.setItem('gest_office_wa', d.officeWhatsAppNumber);
                                }
                                this.saveToLocalStorage();
                                this.showNotify('Ripristinato', 'Dati caricati correttamente.');
                            }
                        } catch (err) { this.showNotify('Errore', 'File non valido.', 'error'); }
                        e.target.value = '';
                    };
                    r.readAsText(f);
                },

                get filteredProducts() {
                    if (!this.searchFilter.products) return this.products;
                    const q = this.searchFilter.products.toLowerCase();
                    return this.products.filter(p => p.name.toLowerCase().includes(q));
                },
                get filteredMultiLoadProducts() {
                    if (!this.searchFilter.multiLoad) return this.products;
                    const q = this.searchFilter.multiLoad.toLowerCase();
                    return this.products.filter(p => p.name.toLowerCase().includes(q));
                },
                get filteredWarehouseStock() {
                    const summary = this.getWarehouseStockSummary();
                    if (!this.searchFilter.warehouse) return summary;
                    const q = this.searchFilter.warehouse.toLowerCase();
                    return summary.filter(item => item.name.toLowerCase().includes(q));
                },
                get filteredBoats() {
                    if (!this.searchFilter.boats) return this.boats;
                    const q = this.searchFilter.boats.toLowerCase();
                    return this.boats.filter(b => b.name.toLowerCase().includes(q));
                }
            };
        }
    </script>
</body>
