<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionale Magazzino & Flotta Pro (A&G COFFEE)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- SheetJS (Esportazione Excel reale .xlsx) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        [x-cloak] { display: none !important; }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; }
            .no-print { display: none !important; }
            .print-modal-wrapper {
                position: static !important; display: block !important; background: transparent !important;
                padding: 0 !important; margin: 0 !important; overflow: visible !important; backdrop-filter: none !important;
            }
            .print-modal-wrapper[style*="display: none"] { display: none !important; }
            #printable-area, #printable-inventory-area {
                position: static !important; width: 100% !important; max-width: 100% !important;
                color: #000 !important; background: #fff !important; box-shadow: none !important;
                border: none !important; padding: 0 !important; margin: 0 !important;
            }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            .print-avoid-break { page-break-inside: avoid; break-inside: avoid; }
        }
    </style>
</head>
<body :class="isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'" class="h-full flex flex-col transition-colors duration-200 overflow-x-hidden" x-data="appData()" x-init="initData()" @keydown.escape.window="handleEscapeKey()">

    <!-- NOTIFICA TOAST -->
    <div x-show="notification.show" x-transition class="fixed top-4 right-4 z-[70] max-w-sm bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-3.5 flex items-center gap-3 no-print" x-cloak>
        <div :class="notification.type === 'error' ? 'bg-red-500/20 text-red-400' : (notification.type === 'alert' ? 'bg-amber-500/20 text-amber-400' : 'bg-emerald-500/20 text-emerald-400')" class="p-2.5 rounded-xl shrink-0">
            <i :class="notification.type === 'error' ? 'fa-solid fa-circle-exclamation' : (notification.type === 'alert' ? 'fa-solid fa-bell fa-shake' : 'fa-solid fa-circle-check')" class="text-base"></i>
        </div>
        <div class="flex-1 min-w-0">
            <h4 class="text-xs font-black text-white" x-text="notification.title"></h4>
            <p class="text-[11px] text-slate-300" x-text="notification.message"></p>
        </div>
        <button @click="notification.show = false" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- 0. SCHERMATA DI ACCESSO SCELTA MODALITÀ -->
    <template x-if="appMode === 'select'">
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950 overflow-y-auto">
            <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-6">
                <div class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-warehouse text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-white">A&G COFFEE SRL</h1>
                    <p class="text-xs text-slate-400 mt-1">Seleziona la postazione operativa</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button @click="switchMode('barca')" class="bg-gradient-to-br from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white p-5 rounded-2xl text-left shadow-lg transition flex flex-col justify-between gap-3">
                        <div class="bg-white/15 w-11 h-11 rounded-xl flex items-center justify-center"><i class="fa-solid fa-sailboat text-xl"></i></div>
                        <div>
                            <h3 class="font-black text-sm sm:text-base">1. Terminale Operatore Barca</h3>
                            <p class="text-[11px] text-emerald-100 mt-1">Conta le rimanenze fisiche a bordo e trasmetti all'ufficio.</p>
                        </div>
                    </button>
                    <button @click="openPasswordModal()" class="bg-gradient-to-br from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white p-5 rounded-2xl text-left shadow-lg transition flex flex-col justify-between gap-3 relative">
                        <span x-show="pendingBoatSubmissions.length > 0" class="absolute top-4 right-4 bg-red-500 text-white px-2.5 py-1 rounded-full text-xs font-black animate-bounce shadow" x-text="pendingBoatSubmissions.length + ' Nuovi'"></span>
                        <div class="bg-white/15 w-11 h-11 rounded-xl flex items-center justify-center"><i class="fa-solid fa-lock text-xl"></i></div>
                        <div>
                            <h3 class="font-black text-sm sm:text-base">2. Postazione Ufficio & Magazzino</h3>
                            <p class="text-[11px] text-blue-100 mt-1">Area riservata protetta da password.</p>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- MODAL PASSWORD UFFICIO -->
    <div x-show="passwordModalOpen" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 no-print" x-cloak>
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-white text-center">
            <div class="bg-blue-600/20 text-blue-400 w-12 h-12 rounded-2xl flex items-center justify-center mx-auto text-lg"><i class="fa-solid fa-shield-halved"></i></div>
            <div>
                <h3 class="text-base font-black">Accesso Riservato Ufficio</h3>
                <p class="text-xs text-slate-400 mt-1">Inserisci la password amministrativa per entrare nel magazzino e nelle impostazioni.</p>
            </div>
            <form @submit.prevent="verifyOfficePassword()" class="space-y-3">
                <input type="password" x-model="enteredPassword" required autofocus class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-3 text-center text-sm font-black tracking-widest focus:outline-none focus:border-blue-500" placeholder="Inserisci password...">
                <p class="text-[10px] text-slate-500">Password predefinita: <span class="text-slate-300 font-bold">admin</span></p>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button type="button" @click="passwordModalOpen = false; enteredPassword = ''" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold">Annulla</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-xs font-black shadow">Sblocca Ufficio</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL CAMBIO PASSWORD -->
    <div x-show="settingsModalOpen" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 no-print" x-cloak>
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-white">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-black flex items-center gap-2"><i class="fa-solid fa-key text-amber-400"></i> Sicurezza Ufficio</h3>
                <button @click="settingsModalOpen = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form @submit.prevent="saveNewOfficePassword()" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Nuova Password Accesso Ufficio</label>
                    <input type="password" x-model="newPasswordInput" required class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500" placeholder="Nuova password...">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">Conferma Nuova Password</label>
                    <input type="password" x-model="confirmPasswordInput" required class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500" placeholder="Ripeti password...">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" @click="settingsModalOpen = false" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-bold">Annulla</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-black">Salva Password</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- 1. TERMINALE OPERATORE BARCA                                             -->
    <!-- ========================================================================= -->
    <template x-if="appMode === 'barca'">
        <div class="flex-1 flex flex-col h-full bg-slate-950 text-slate-100">
            <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between sticky top-0 z-40">
                <div class="flex items-center gap-2.5">
                    <div class="bg-emerald-600 p-2.5 rounded-xl text-white shadow"><i class="fa-solid fa-sailboat"></i></div>
                    <div>
                        <h2 class="text-sm sm:text-base font-black">Terminale Operatore Barca</h2>
                        <p class="text-[11px] text-slate-400">Conteggio Rimanenze Fisiche & Trasmissione Ufficio</p>
                    </div>
                </div>
                <button @click="switchMode('select')" class="bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-xl text-xs font-bold text-slate-300">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Cambia Postazione
                </button>
            </header>

            <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4 overflow-y-auto pb-36">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2.5 shadow">
                    <label class="block text-xs font-extrabold text-emerald-400 uppercase tracking-wider">Seleziona la tua Imbarcazione:</label>
                    <select x-model="selectedBoatForCrew" @change="loadCrewInventory()" class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3.5 py-3 text-sm font-black focus:outline-none focus:border-emerald-500">
                        <option value="">-- Seleziona Barca --</option>
                        <template x-for="b in boats" :key="b.id">
                            <option :value="b.id" x-text="b.name"></option>
                        </template>
                    </select>
                </div>

                <template x-if="selectedBoatForCrew">
                    <div class="space-y-4">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h3 class="text-sm font-black text-white flex items-center gap-2">
                                    <i class="fa-solid fa-boxes-stacked text-emerald-400"></i>
                                    <span x-text="'Rimanenze Fisiche: ' + getBoatName(selectedBoatForCrew)"></span>
                                </h3>
                                <p class="text-[11px] text-slate-400 mt-0.5">Inserisci le quantità fisicamente rimaste a bordo e trasmetti all'ufficio.</p>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <input type="text" x-model="searchFilter.crewProducts" placeholder="🔍 Filtra voce..." class="bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs flex-1 sm:w-44">
                                <input type="date" x-model="crewInventoryDate" class="bg-slate-950 border border-slate-700 text-white rounded-xl px-2.5 py-2 text-xs font-bold">
                            </div>
                        </div>

                        <!-- Griglia Conteggio Articoli -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            <template x-for="row in filteredCrewInventoryRows" :key="row.productId">
                                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-3">
                                    <span class="font-extrabold text-xs sm:text-sm truncate flex-1 text-white" x-text="row.productName"></span>
                                    <div class="flex items-center gap-1.5 shrink-0">
                                        <button type="button" @click="row.physicalQty = Math.max(0, Number(row.physicalQty || 0) - 1)" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-black text-base">-</button>
                                        <input type="number" step="0.01" min="0" x-model.number="row.physicalQty" class="w-16 bg-slate-950 border border-slate-700 text-emerald-400 rounded-xl text-center font-black text-sm py-2 focus:outline-none focus:border-emerald-500">
                                        <button type="button" @click="row.physicalQty = Number(row.physicalQty || 0) + 1" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-black text-base">+</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Pulsanti Trasmissione (Senza link lunghi che bloccano WhatsApp) -->
                        <div class="sticky bottom-3 bg-slate-950/90 backdrop-blur p-2.5 rounded-2xl border border-slate-800 grid grid-cols-1 sm:grid-cols-2 gap-2.5 shadow-2xl">
                            <button type="button" @click="copyCrewWhatsAppReport()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-3.5 px-4 rounded-xl text-xs font-black shadow-lg transition flex items-center justify-center gap-2">
                                <i class="fa-brands fa-whatsapp text-base"></i> 1. Copia Riepilogo per WhatsApp
                            </button>
                            <button type="button" @click="downloadCrewSubmissionFile()" class="bg-blue-600 hover:bg-blue-500 text-white py-3.5 px-4 rounded-xl text-xs font-black shadow-lg transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-file-export text-sm"></i> 2. Scarica File Scheda (.json)
                            </button>
                        </div>
                    </div>
                </template>
            </main>
        </div>
    </template>

    <!-- ========================================================================= -->
    <!-- 2. POSTAZIONE UFFICIO & MAGAZZINO                                         -->
    <!-- ========================================================================= -->
    <template x-if="appMode === 'ufficio'">
        <div class="flex-1 flex flex-col h-full">
            <!-- Header Ufficio -->
            <header :class="isDarkMode ? 'bg-slate-900/95 border-slate-800' : 'bg-white/95 border-slate-200'" class="border-b sticky top-0 z-40 no-print">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <button @click="switchMode('select')" :class="isDarkMode ? 'bg-slate-800 text-slate-300 hover:text-white' : 'bg-slate-200 text-slate-700'" class="p-2.5 rounded-xl" title="Blocca ed Esci"><i class="fa-solid fa-lock"></i></button>
                        <div class="bg-blue-600 p-2.5 rounded-2xl text-white shadow-md shadow-blue-500/20 shrink-0">
                            <i class="fa-solid fa-warehouse text-lg"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <h1 class="text-sm sm:text-base font-black tracking-tight truncate">Ufficio & Magazzino Centrale Pro</h1>
                                <span class="hidden sm:inline-flex items-center gap-1 text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Live Sync
                                </span>
                            </div>
                            <p class="text-[11px] text-slate-400 truncate">A&G COFFEE SRL • Controllo Flotta, DDT & Riscontro Cassa</p>
                        </div>
                    </div>

                    <!-- Azioni Rapide Header -->
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button @click="openSettingsModal()" class="bg-amber-600/20 text-amber-400 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5" title="Impostazioni Password">
                            <i class="fa-solid fa-key"></i><span class="hidden sm:inline">Password</span>
                        </button>
                        <button @click="exportBackup()" class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5" title="Backup Completo">
                            <i class="fa-solid fa-download"></i><span class="hidden sm:inline">Backup</span>
                        </button>
                        <label class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer" title="Importa File Barca o Backup">
                            <i class="fa-solid fa-upload"></i><span class="hidden sm:inline">Importa File</span>
                            <input type="file" accept=".json" @change="importBackup($event)" class="hidden">
                        </label>
                        <button @click="toggleTheme()" :class="isDarkMode ? 'bg-slate-800 text-amber-400 border-slate-700' : 'bg-slate-200 text-slate-700 border-slate-300'" class="p-2.5 rounded-xl border text-xs font-bold">
                            <i :class="isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content Ufficio -->
            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-4 pb-12 overflow-y-auto no-print space-y-4">

                <!-- Griglia Finestre Colorate Navigazione Ufficio -->
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                    <button @click="activeTab = 'dashboard'" :class="activeTab === 'dashboard' ? 'ring-2 ring-blue-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-blue-600 to-indigo-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-chart-pie text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Dashboard</h3>
                            <p class="text-[10px] text-blue-100">Panoramica Ufficio</p>
                        </div>
                    </button>
                    <button @click="activeTab = 'rimanenze'" :class="activeTab === 'rimanenze' ? 'ring-2 ring-emerald-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-emerald-600 to-teal-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2 relative">
                        <i class="fa-solid fa-bell text-lg"></i>
                        <span x-show="pendingBoatSubmissions.length > 0" class="absolute top-2.5 right-2.5 bg-red-500 text-white px-2 py-0.5 rounded-full text-[10px] font-black animate-pulse shadow" x-text="pendingBoatSubmissions.length"></span>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Rimanenze</h3>
                            <p class="text-[10px] text-emerald-100">Da Barche (<span x-text="pendingBoatSubmissions.length"></span>)</p>
                        </div>
                    </button>
                    <button @click="activeTab = 'magazzino'" :class="activeTab === 'magazzino' ? 'ring-2 ring-purple-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-purple-600 to-fuchsia-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-truck-ramp-box text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Carico DDT</h3>
                            <p class="text-[10px] text-purple-100">Magazzino & Bolle</p>
                        </div>
                    </button>
                    <button @click="activeTab = 'flotta'" :class="activeTab === 'flotta' ? 'ring-2 ring-amber-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-amber-600 to-orange-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-sailboat text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Flotta & Barche</h3>
                            <p class="text-[10px] text-amber-100" x-text="boats.length + ' Unità Navali'"></p>
                        </div>
                    </button>
                    <button @click="activeTab = 'prodotti'" :class="activeTab === 'prodotti' ? 'ring-2 ring-sky-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-sky-600 to-cyan-700 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-tags text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Listino</h3>
                            <p class="text-[10px] text-sky-100" x-text="products.length + ' Articoli'"></p>
                        </div>
                    </button>
                    <button @click="activeTab = 'storico'" :class="activeTab === 'storico' ? 'ring-2 ring-teal-300 scale-[1.01]' : 'opacity-85 hover:opacity-100'" class="bg-gradient-to-br from-teal-700 to-emerald-800 p-3.5 rounded-2xl text-left text-white shadow-md transition flex flex-col justify-between gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                        <div>
                            <h3 class="font-black text-xs sm:text-sm">Storico & Storia</h3>
                            <p class="text-[10px] text-teal-100">Verbali & Traccia</p>
                        </div>
                    </button>
                </div>

                <!-- 1. DASHBOARD UFFICIO -->
                <div x-show="activeTab === 'dashboard'" class="space-y-4">
                    <div :class="isDarkMode ? 'bg-gradient-to-r from-blue-900/40 via-slate-900 to-slate-900 border-slate-800' : 'bg-white border-slate-200'" class="border p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                        <div>
                            <h2 class="text-base sm:text-lg font-black">Ufficio Centrale & Magazzino Pro 🏢</h2>
                            <p class="text-xs text-slate-400 mt-0.5">Area protetta. Gestisci i riscontri delle rimanenze trasmesse dalle barche, i carichi DDT e la flotta.</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="activeTab = 'rimanenze'" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs font-extrabold shadow flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-bell"></i> Rimanenze da Verificare (<span x-text="pendingBoatSubmissions.length"></span>)
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div :class="isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'" class="border p-4 rounded-2xl">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Valore Magazzino (Costo)</p>

                loadCrewInventory() {

                    }));
                },
                get filteredCrewInventoryRows() {
                    if (!this.searchFilter.crewProducts) return this.crewInventoryRows;
                    const q = this.searchFilter.crewProducts.toLowerCase();
                    return this.crewInventoryRows.filter(r => r.productName.toLowerCase().includes(q));
                },
                buildCurrentCrewSubmission() {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                    return {
                        id: 'sub_' + Date.now(),
                        timestamp: Date.now(),
                        boatId: this.selectedBoatForCrew,
                        date: this.crewInventoryDate,
                        time: timeStr,
                        items: JSON.parse(JSON.stringify(this.crewInventoryRows))
                    };
                },
                copyCrewWhatsAppReport() {
                    if (!this.selectedBoatForCrew) {
                        this.showNotify('Attenzione', 'Seleziona prima la tua barca.', 'error');
                        return;
                    }
                    const sub = this.buildCurrentCrewSubmission();
                    const boatName = this.getBoatName(sub.boatId);
                    const countedItems = sub.items.filter(r => Number(r.physicalQty || 0) > 0);

                    let summaryText = `📊 *RIMANENZE FISICHE: ${boatName}*\n📅 Data: ${sub.date} (${sub.time})\n\n`;
                    if (countedItems.length > 0) {
                        countedItems.forEach(i => {
                            summaryText += `• ${i.productName}: *${i.physicalQty} Pz*\n`;
                        });
                    } else {
                        summaryText += `_Tutte le rimanenze a 0 Pz_\n`;
                    }

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(summaryText).then(() => {
                            this.showNotify('Copiato negli appunti!', 'Apri WhatsApp e incolla il messaggio per l\'ufficio.');
                        }).catch(() => {
                            this.showNotify('Pronto', 'Usa il pulsante 2 per scaricare il file scheda.');
                        });
                    } else {
                        this.showNotify('Pronto', 'Usa il pulsante 2 per scaricare il file scheda.');
                    }
                },
                downloadCrewSubmissionFile() {
                    if (!this.selectedBoatForCrew) {
                        this.showNotify('Attenzione', 'Seleziona prima la tua barca.', 'error');
                        return;
                    }
                    const sub = this.buildCurrentCrewSubmission();
                    const boatName = this.getBoatName(sub.boatId).replace(/\s+/g, '_');
                    const payload = { type: 'boat_submission', submission: sub };
                    const fileName = `rimanenze_${boatName}_${sub.date}.json`;
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                    const file = new File([blob], fileName, { type: 'application/json' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: `Rimanenze ${boatName}`,
                            text: `Scheda rimanenze ${boatName} del ${sub.date}`
                        }).catch(() => {});
                    } else {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        this.showNotify('File Scaricato', `File "${fileName}" pronto da allegare su WhatsApp!`);
                    }
                },

                deletePendingSubmission(id) {
                    this.pendingBoatSubmissions = this.pendingBoatSubmissions.filter(s => s.id !== id);
                    this.saveToLocalStorage();
                },

                openReconciliationModal(sub) {
                    this.reconciliationModal.submission = sub;
                    const boatId = sub.boatId;

                    const boatInvs = this.inventoryLogs.filter(i => i.boatId === boatId);
                    const lastInv = boatInvs.length > 0 ? boatInvs[boatInvs.length - 1] : null;
                    const lastTs = lastInv ? (lastInv.timestamp || 0) : 0;

                    let initMap = {}, addMap = {}, movMap = {}, pendMap = {}, pendRevMap = {};

                    if (lastInv && lastInv.items) {
                        lastInv.items.forEach(i => {
                            const nid = this.getNormalizedGroupId(i.productId);
                            initMap[nid] = (initMap[nid] || 0) + Number(i.physicalQty || 0);
                        });
                    }

                    this.transfers.filter(t => t.boatId === boatId && (t.timestamp || 0) > lastTs).forEach(t => {
                        t.items.forEach(i => {
                            const nid = this.getNormalizedGroupId(i.productId);
                            addMap[nid] = (addMap[nid] || 0) + Number(i.quantity || 0);
                        });
                    });

                    this.boatTransfers.filter(bt => bt.toBoatId === boatId && (bt.timestamp || 0) > lastTs).forEach(bt => {
                        bt.items.forEach(i => {
                            const nid = this.getNormalizedGroupId(i.productId);
                            movMap[nid] = (movMap[nid] || 0) + Number(i.quantity || 0);
                        });
                    });

                    this.boatTransfers.filter(bt => bt.fromBoatId === boatId && (bt.timestamp || 0) > lastTs).forEach(bt => {
                        bt.items.forEach(i => {
                            const nid = this.getNormalizedGroupId(i.productId);
                            movMap[nid] = (movMap[nid] || 0) - Number(i.quantity || 0);
                        });
                    });

                    this.pendolariSheets.filter(ps => ps.boatId === boatId && (ps.timestamp || 0) > lastTs).forEach(ps => {
                        ps.items.forEach(i => {
                            const nid = this.getNormalizedGroupId(i.productId);
                            pendMap[nid] = (pendMap[nid] || 0) + Number(i.quantity || 0);
                            const p = ps.sheetType === 'comando' ? 0 : Number(i.customPrice || 0);
                            pendRevMap[nid] = (pendRevMap[nid] || 0) + (Number(i.quantity || 0) * p);
                        });
                    });

                    this.reconciliationRows = sub.items.map(item => {
                        const id = item.productId;
                        const initialQty = initMap[id] || 0;
                        const addedQty = addMap[id] || 0;
                        const movedQty = movMap[id] || 0;
                        const theoreticalQty = Math.max(0, initialQty + addedQty + movedQty);
                        const physicalQty = Number(item.physicalQty || 0);
                        const soldQty = Math.max(0, theoreticalQty - physicalQty);
                        const pendolariQty = pendMap[id] || 0;
                        const explicitPendolariRev = pendRevMap[id] || 0;

                        const effPendQty = Math.min(soldQty, pendolariQty);
                        const pubSoldQty = Math.max(0, soldQty - effPendQty);
                        const pendRev = pendolariQty > 0 ? explicitPendolariRev * Math.min(1, effPendQty / pendolariQty) : 0;

                        const pObj = this.products.find(x => x.id === id) || this.getGroupedSelectableProducts().find(x => x.id === id);
                        const sellPrice = pObj ? (pObj.sellPrice || 0) : 0;
                        const expectedRevenue = pendRev + (pubSoldQty * sellPrice);

                        return {
                            productId: id,
                            productName: item.productName,
                            initialQty, addedQty, movedQty, theoreticalQty,
                            physicalQty, soldQty, pendolariQty, sellPrice, expectedRevenue
                        };
                    });

                    this.reconciliationExpectedTotal = this.reconciliationRows.reduce((sum, r) => sum + r.expectedRevenue, 0);
                    this.reconciliationActualRevenue = Number(this.reconciliationExpectedTotal.toFixed(2));
                    this.reconciliationDiff = 0;

                    this.reconciliationModal.open = true;
                },

                updateReconciliationDiff() {
                    this.reconciliationDiff = Number(this.reconciliationActualRevenue || 0) - this.reconciliationExpectedTotal;
                },

                finalizeReconciliation() {
                    const sub = this.reconciliationModal.submission;
                    const ts = Date.now();
                    this.updateReconciliationDiff();
                    const newInv = {
                        id: 'inv_' + ts,
                        timestamp: ts,
                        boatId: sub.boatId,
                        date: sub.date,
                        items: JSON.parse(JSON.stringify(this.reconciliationRows)),
                        expectedRevenue: this.reconciliationExpectedTotal,
                        actualRevenue: Number(this.reconciliationActualRevenue || 0),
                        cashDiff: this.reconciliationDiff
                    };
                    this.inventoryLogs.push(newInv);
                    this.pendingBoatSubmissions = this.pendingBoatSubmissions.filter(s => s.id !== sub.id);
                    this.saveToLocalStorage();
                    this.reconciliationModal.open = false;
                    this.openSavedInventoryPrint(newInv);
                    this.showNotify('Sistema Aggiornato!', 'Verbale chiuso, giacenze di bordo e storico aggiornati.');
                },

                getBoatTotalItemsCount(boatId) {
                    const invs = this.inventoryLogs.filter(i => i.boatId === boatId);
                    const lastInv = invs.length > 0 ? invs[invs.length - 1] : null;
                    const lastTs = lastInv ? (lastInv.timestamp || 0) : 0;
                    let tot = 0;
                    if (lastInv && lastInv.items) lastInv.items.forEach(i => tot += Number(i.physicalQty || 0));
                    this.transfers.filter(t => t.boatId === boatId && (t.timestamp || 0) > lastTs).forEach(t => t.items.forEach(i => tot += Number(i.quantity || 0)));
                    this.boatTransfers.filter(bt => bt.toBoatId === boatId && (bt.timestamp || 0) > lastTs).forEach(bt => bt.items.forEach(i => tot += Number(i.quantity || 0)));
                    this.boatTransfers.filter(bt => bt.fromBoatId === boatId && (bt.timestamp || 0) > lastTs).forEach(bt => bt.items.forEach(i => tot -= Number(i.quantity || 0)));
                    return Math.max(0, tot);
                },
                getLastInventoryDate(boatId) {
                    const invs = this.inventoryLogs.filter(i => i.boatId === boatId);
                    return invs.length > 0 ? invs[invs.length - 1].date : 'Mai';
                },

                openBoatHub(boatId, tab = 'scarico') {
                    this.boatHub.boatId = boatId;
                    this.boatHub.tab = tab;
                    this.boatHub.open = true;
                },
                getWarehouseProductQty(productId) {
                    let loaded = 0, transferred = 0;
                    this.warehouseLoads.forEach(l => (l.items || [l]).forEach(i => { if (i.productId === productId) loaded += Number(i.quantity); }));
                    this.transfers.forEach(t => t.items.forEach(i => { if (i.productId === productId) transferred += Number(i.quantity); }));
                    return Math.max(0, loaded - transferred);
                },
                getWarehouseStockSummary() {
                    return this.products.map(p => {
                        const qty = this.getWarehouseProductQty(p.id);
                        return { productId: p.id, name: p.name, qty, totalCost: qty * p.costPrice };
                    });
                },
                getTotalWarehouseCostValue() {
                    return this.getWarehouseStockSummary().reduce((sum, i) => sum + i.totalCost, 0);
                },
                getProductTotalLoaded(productId) {
                    let total = 0;
                    this.warehouseLoads.forEach(l => (l.items || [l]).forEach(i => { if (i.productId === productId) total += Number(i.quantity); }));
                    return total;
                },
                getProductTotalTransferred(productId) {
                    let total = 0;
                    this.transfers.forEach(t => t.items.forEach(i => { if (i.productId === productId) total += Number(i.quantity); }));
                    return total;
                },
                getProductTimeline(productId) {
                    const events = [];
                    const normId = this.getNormalizedGroupId(productId);
                    this.warehouseLoads.forEach(l => {
                        (l.items || [l]).forEach(i => {
                            if (i.productId === productId) {
                                events.push({ id: l.id + i.productId, ts: l.timestamp || 0, date: l.date, type: 'Carico DDT Magazzino', detail: l.docNumber, qtyLabel: '+' + i.quantity + ' Pz', color: 'text-blue-400' });
                            }
                        });
                    });
                    this.transfers.forEach(t => {
                        t.items.forEach(i => {
                            if (i.productId === productId) {
                                events.push({ id: t.id + i.productId, ts: t.timestamp || 0, date: t.date, type: 'Scarico su Barca', detail: `${t.bollaNumber} ➔ ${this.getBoatName(t.boatId)}`, qtyLabel: '-' + i.quantity + ' Pz', color: 'text-purple-400' });
                            }
                        });
                    });
                    this.boatTransfers.forEach(bt => {
                        bt.items.forEach(i => {
                            if (i.productId === productId || i.productId === normId) {
                                events.push({ id: bt.id + i.productId, ts: bt.timestamp || 0, date: bt.date, type: 'Spostamento Barche', detail: `${this.getBoatName(bt.fromBoatId)} ➔ ${this.getBoatName(bt.toBoatId)}`, qtyLabel: i.quantity + ' Pz', color: 'text-amber-400' });
                            }
                        });
                    });
                    this.pendolariSheets.forEach(ps => {
                        ps.items.forEach(i => {
                            if (i.productId === productId || i.productId === normId) {
                                const label = ps.sheetType === 'comando' ? 'Buono Comando (0€)' : (ps.sheetType === 'equipaggio' ? 'Guide/Equipaggio' : 'Pendolari');
                                events.push({ id: ps.id + i.productId, ts: ps.timestamp || 0, date: ps.date, type: label, detail: this.getBoatName(ps.boatId), qtyLabel: i.quantity + ' Pz', color: 'text-sky-400' });
                            }
                        });
                    });
                    return events.sort((a, b) => b.ts - a.ts);
                },

                openProductModal() {
                    this.productModal.isEdit = false;
                    this.productModal.form = { id: 'p_' + Date.now(), name: '', costPrice: 0, pendolariPrice: 0, sellPrice: 0 };
                    this.productModal.open = true;
                },
                editProduct(p) {
                    this.productModal.isEdit = true;
                    this.productModal.form = { ...p };
                    this.productModal.open = true;
                },
                saveProduct() {
                    if (this.productModal.isEdit) {
                        const i = this.products.findIndex(p => p.id === this.productModal.form.id);
                        if (i !== -1) this.products[i] = { ...this.productModal.form };
                    } else {
                        this.products.push({ ...this.productModal.form });
                    }
                    this.productModal.open = false;
                    this.saveToLocalStorage();
                },
                deleteProduct(id) {
                    this.products = this.products.filter(p => p.id !== id);
                    this.saveToLocalStorage();
                },

                openBoatModal() {
                    this.boatModal.isEdit = false;
                    this.boatModal.form = { id: 'boat_' + Date.now(), name: '' };
                    this.boatModal.open = true;
                },
                editBoat(b) {
                    this.boatModal.isEdit = true;
                    this.boatModal.form = { ...b };
                    this.boatModal.open = true;
                },
                saveBoat() {
                    if (this.boatModal.isEdit) {
                        const i = this.boats.findIndex(b => b.id === this.boatModal.form.id);
                        if (i !== -1) this.boats[i] = { ...this.boatModal.form };
                    } else {
                        this.boats.push({ ...this.boatModal.form });
                    }
                    this.boatModal.open = false;
                    this.saveToLocalStorage();
                },
                deleteBoat(id) {
                    this.boats = this.boats.filter(b => b.id !== id);
                    this.saveToLocalStorage();
                },

                onSelectSingleLoadProduct() {
                    const p = this.products.find(x => x.id === this.currentLoadItem.productId);
                    if (p) this.currentLoadItem.costPrice = p.costPrice;
                },
                addWarehouseLoad() {
                    if (!this.loadForm.docNumber || this.loadForm.items.length === 0) return;
                    this.warehouseLoads.push({ id: 'load_' + Date.now(), timestamp: Date.now(), ...this.loadForm, items: [...this.loadForm.items] });
                    this.saveToLocalStorage();
                    this.loadForm.docNumber = '';
                    this.loadForm.items = [];
                    this.showNotify('Caricato', 'DDT registrato in magazzino.');
                },
                addLoadItem() {
                    if (!this.currentLoadItem.productId || !this.currentLoadItem.quantity) return;
                    this.loadForm.items.push({ ...this.currentLoadItem });
                    this.currentLoadItem = { productId: '', quantity: '', costPrice: '' };
                },
                removeLoadItem(idx) { this.loadForm.items.splice(idx, 1); },
                deleteWarehouseLoad(id) {
                    this.warehouseLoads = this.warehouseLoads.filter(l => l.id !== id);
                    this.saveToLocalStorage();
                },
                addAllMultiLoadItems() {
                    let count = 0;
                    this.products.forEach(p => {
                        const q = Number(this.multiLoadQuantities[p.id] || 0);
                        if (q > 0) {
                            this.loadForm.items.push({ productId: p.id, quantity: q, costPrice: p.costPrice });
                            this.multiLoadQuantities[p.id] = '';
                            count++;
                        }
                    });
                    if (count > 0) this.showNotify('Aggiunti', `${count} prodotti nel DDT.`);
                },

                createTransferFromHub() {
                    if (!this.transferForm.bollaNumber || this.transferForm.items.length === 0) return;
                    const newT = { id: 't_' + Date.now(), timestamp: Date.now(), boatId: this.boatHub.boatId, ...this.transferForm, items: [...this.transferForm.items] };
                    this.transfers.push(newT);
                    this.saveToLocalStorage();
                    this.transferForm.bollaNumber = '';
                    this.transferForm.items = [];
                    this.boatHub.open = false;
                    this.showNotify('Caricata', 'Bolla registrata sulla barca.');
                },
                addAllMultiTransferItems() {
                    this.products.forEach(p => {
                        const q = Number(this.multiTransferQuantities[p.id] || 0);
                        if (q > 0) {
                            this.transferForm.items.push({ productId: p.id, quantity: q });
                            this.multiTransferQuantities[p.id] = '';
                        }
                    });
                },
                deleteTransfer(id) {
                    this.transfers = this.transfers.filter(t => t.id !== id);
                    this.saveToLocalStorage();
                },

                onSheetTypeChange() {
                    if (this.pendolariForm.sheetType === 'comando') {
                        this.currentPendolariItem.customPrice = 0;
                    } else {
                        this.onPendolariProductSelect();
                    }
                },
                onPendolariProductSelect() {
                    if (this.pendolariForm.sheetType === 'comando') {
                        this.currentPendolariItem.customPrice = 0;
                        return;
                    }
                    const grp = this.getGroupInfoForProduct(this.currentPendolariItem.productId);
                    if (grp) {
                        this.currentPendolariItem.customPrice = this.pendolariForm.sheetType === 'equipaggio' ? Number((grp.pendolariPrice * 0.5).toFixed(2)) : grp.pendolariPrice;
                    } else {
                        const p = this.products.find(x => x.id === this.currentPendolariItem.productId);
                        this.currentPendolariItem.customPrice = p ? (this.pendolariForm.sheetType === 'equipaggio' ? Number((p.pendolariPrice * 0.5).toFixed(2)) : p.pendolariPrice) : 0;
                    }
                },
                addPendolariItem() {
                    if (!this.currentPendolariItem.productId) return;
                    const price = this.pendolariForm.sheetType === 'comando' ? 0 : Number(this.currentPendolariItem.customPrice || 0);
                    this.pendolariForm.items.push({ productId: this.currentPendolariItem.productId, quantity: Number(this.currentPendolariItem.quantity || 1), customPrice: price });
                    this.currentPendolariItem = { productId: '', quantity: 1, customPrice: 0 };
                },
                savePendolariSheetFromHub() {
                    if (this.pendolariForm.items.length === 0) return;
                    this.pendolariSheets.push({ id: 'ps_' + Date.now(), timestamp: Date.now(), boatId: this.boatHub.boatId, ...this.pendolariForm, items: [...this.pendolariForm.items] });
                    this.saveToLocalStorage();
                    this.pendolariForm.notes = '';
                    this.pendolariForm.items = [];
                    this.boatHub.open = false;
                    this.showNotify('Registrato', 'Buono / Scheda salvata correttamente.');
                },

                createBoatTransferFromHub() {
                    if (!this.boatTransferForm.bollaNumber || !this.boatTransferForm.toBoatId || this.boatTransferForm.items.length === 0) return;
                    this.boatTransfers.push({ id: 'bt_' + Date.now(), timestamp: Date.now(), fromBoatId: this.boatHub.boatId, ...this.boatTransferForm, items: [...this.boatTransferForm.items] });
                    this.saveToLocalStorage();
                    this.boatTransferForm.bollaNumber = '';
                    this.boatTransferForm.toBoatId = '';
                    this.boatTransferForm.items = [];
                    this.boatHub.open = false;
                    this.showNotify('Trasferito', 'Spostamento tra barche completato.');
                },
                addAllMultiBoatTransferItems() {
                    this.getGroupedSelectableProducts().forEach(p => {
                        const q = Number(this.multiBoatTransferQuantities[p.id] || 0);
                        if (q > 0) {
                            this.boatTransferForm.items.push({ productId: p.id, quantity: q });
                            this.multiBoatTransferQuantities[p.id] = '';
                        }
                    });
                },
                deleteBoatTransfer(id) {
                    this.boatTransfers = this.boatTransfers.filter(bt => bt.id !== id);
                    this.saveToLocalStorage();
                },

                printDocLoad(load) {
                    this.printModal = { open: true, title: 'DDT Magazzino', docNumber: load.docNumber, date: load.date, destination: 'MAGAZZINO GENERALE', destinationCity: 'POZZUOLI', items: load.items || [load] };
                },
                printTransfer(t) {
                    this.printModal = { open: true, title: 'Bolla Carico Barca', docNumber: t.bollaNumber, date: t.date, destination: this.getBoatName(t.boatId), destinationCity: 'NAPOLI', items: t.items };
                },
                printBoatTransferDoc(bt) {
                    this.printModal = { open: true, title: 'Bolla Spostamento', docNumber: bt.bollaNumber, date: bt.date, destination: this.getBoatName(bt.toBoatId), destinationCity: 'NAPOLI', items: bt.items };
                },
                openSavedInventoryPrint(inv) {
                    this.inventoryPrintModal.data = {
                        boatName: this.getBoatName(inv.boatId),
                        date: inv.date,
                        expectedRevenue: inv.expectedRevenue,
                        actualRevenue: inv.actualRevenue,
                        cashDiff: inv.cashDiff,
                        items: inv.items.map(i => ({ ...i, productName: i.productName || this.getProductName(i.productId) }))
                    };
                    this.inventoryPrintModal.open = true;
                },
                deleteInventoryLog(id) {
                    this.inventoryLogs = this.inventoryLogs.filter(i => i.id !== id);
                    this.saveToLocalStorage();
                },
                exportSingleInventoryExcel(inv) {
                    if (typeof XLSX === 'undefined') return;
                    const boatName = this.getBoatName(inv.boatId);
                    const wb = XLSX.utils.book_new();
                    const rows = [
                        ["VERBALE INVENTARIO - " + boatName + " (" + inv.date + ")"],
                        [],
                        ["Voce", "Iniziale", "Carichi", "Spostamenti", "Teorica", "Fisica", "Venduti", "Pend/Buoni", "Prezzo Pub.", "Incasso Atteso"]
                    ];
                    inv.items.forEach(i => rows.push([i.productName || this.getProductName(i.productId), i.initialQty ?? 0, i.addedQty ?? 0, i.movedQty ?? 0, i.theoreticalQty, i.physicalQty, i.soldQty, i.pendolariQty ?? 0, i.sellPrice, i.expectedRevenue]));
                    rows.push([], ["Incasso Atteso:", inv.expectedRevenue], ["Incasso Reale:", inv.actualRevenue], ["Plus/Ammanco:", inv.cashDiff]);
                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    XLSX.utils.book_append_sheet(wb, ws, "Inventario");
                    XLSX.writeFile(wb, `Inventario_${boatName}_${inv.date}.xlsx`);
                },
                exportAllInventoriesExcel() {
                    if (typeof XLSX === 'undefined') return;
                    const wb = XLSX.utils.book_new();
                    const rows = [["Data", "Barca", "Atteso", "Reale", "Plus/Ammanco"]];
                    this.inventoryLogs.forEach(i => rows.push([i.date, this.getBoatName(i.boatId), i.expectedRevenue, i.actualRevenue, i.cashDiff]));
                    const ws = XLSX.utils.aoa_to_sheet(rows);
                    XLSX.utils.book_append_sheet(wb, ws, "Storico");
                    XLSX.writeFile(wb, `Storico_Inventari.xlsx`);
                },
                triggerPrint() { window.print(); },

                exportBackup() {
                    const data = { products: this.products, warehouseLoads: this.warehouseLoads, boats: this.boats, transfers: this.transfers, boatTransfers: this.boatTransfers, pendolariSheets: this.pendolariSheets, inventoryLogs: this.inventoryLogs, pendingBoatSubmissions: this.pendingBoatSubmissions };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `backup_flotta_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                },
                importBackup(e) {
                    const f = e.target.files[0];
                    if (!f) return;
                    const r = new FileReader();
                    r.onload = (ev) => {
                        try {
                            const d = JSON.parse(ev.target.result);
                            if (d.type === 'boat_submission' && d.submission) {
                                if (!this.pendingBoatSubmissions.some(s => s.id === d.submission.id)) {
                                    this.pendingBoatSubmissions.push(d.submission);
                                    this.saveToLocalStorage();
                                }
                                this.activeTab = 'rimanenze';
                                this.showNotify('Scheda Barca Importata', `Rimanenze di ${this.getBoatName(d.submission.boatId)} aggiunte alle notifiche.`);
                            } else if (d.products) {
                                this.products = d.products;
                                this.boats = d.boats || this.boats;
                                this.warehouseLoads = d.warehouseLoads || [];
                                this.transfers = d.transfers || [];
                                this.boatTransfers = d.boatTransfers || [];
                                this.pendolariSheets = d.pendolariSheets || [];
                                this.inventoryLogs = d.inventoryLogs || [];
                                this.pendingBoatSubmissions = d.pendingBoatSubmissions || [];
                                this.saveToLocalStorage();
                                this.showNotify('Ripristinato', 'Backup completo caricato e sincronizzato.');
                            } else {
                                this.showNotify('Errore', 'Formato file non riconosciuto.', 'error');
                            }
                        } catch (err) { this.showNotify('Errore', 'File non valido.', 'error'); }
                        e.target.value = '';
                    };
                    r.readAsText(f);
                },

                get filteredProducts() {
                    if (!this.searchFilter.products) return this.products;
                    const q = this.searchFilter.products.toLowerCase();
                    return this.products.filter(p => p.name.toLowerCase().includes(q));
                },
                get filteredMultiLoadProducts() {
                    if (!this.searchFilter.multiLoad) return this.products;
                    const q = this.searchFilter.multiLoad.toLowerCase();
                    return this.products.filter(p => p.name.toLowerCase().includes(q));
                },
                get filteredMultiTransferProducts() {
                    if (!this.searchFilter.multiTransfer) return this.products;
                    const q = this.searchFilter.multiTransfer.toLowerCase();
                    return this.products.filter(p => p.name.toLowerCase().includes(q));
                },
                get filteredMultiBoatTransferProducts() {
                    const list = this.getGroupedSelectableProducts();
                    if (!this.searchFilter.multiBoatTransfer) return list;
                    const q = this.searchFilter.multiBoatTransfer.toLowerCase();
                    return list.filter(p => p.name.toLowerCase().includes(q));
                },
                get filteredWarehouseStock() {
                    const summary = this.getWarehouseStockSummary();
                    if (!this.searchFilter.warehouse) return summary;
                    const q = this.searchFilter.warehouse.toLowerCase();
                    return summary.filter(item => item.name.toLowerCase().includes(q));
                },
                get filteredBoats() {
                    if (!this.searchFilter.boats) return this.boats;
                    const q = this.searchFilter.boats.toLowerCase();
                    return this.boats.filter(b => b.name.toLowerCase().includes(q));
                }
            };
        }
    </script>
</body>
</html>
